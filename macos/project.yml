name: WxMac
options:
  bundleIdPrefix: com.mwirges
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # Xcode 27 — keep LastUpgradeCheck locked so regenerate doesn't re-nag.
  xcodeVersion: "2700"
attributes:
  LastUpgradeCheck: "2700"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  WxMac:
    type: application
    platform: macOS
    sources:
      - path: WxMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mwirges.wx
        PRODUCT_NAME: wx
        INFOPLIST_FILE: WxMac/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: false
        Release:
          ENABLE_HARDENED_RUNTIME: true
          CODE_SIGN_ENTITLEMENTS: WxMac/WxMac.entitlements
    postBuildScripts:
      - name: Embed wx CLI
        basedOnDependencyAnalysis: false
        script: |
          CLI_SRC="${PROJECT_DIR}/../build/wx"
          if [ ! -f "${CLI_SRC}" ]; then
            (cd "${PROJECT_DIR}/.." && make build)
          fi
          if [ -f "${CLI_SRC}" ]; then
            DEST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/MacOS/wx-cli"
            mkdir -p "$(dirname "${DEST}")"
            cp -f "${CLI_SRC}" "${DEST}"
            chmod +x "${DEST}"
            codesign --force --sign - --timestamp=none "${DEST}" 2>/dev/null || true
          fi
    scheme:
      testTargets:
        - WxMacUITests
  WxMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: WxMacUITests
        excludes:
          - "Fixtures/**"
    resources:
      - path: WxMacUITests/Fixtures
    dependencies:
      - target: WxMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mwirges.wx.uitests
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "NO"
    postBuildScripts:
      - name: Copy wx-stub
        basedOnDependencyAnalysis: false
        script: |
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${DEST}"
          cp -f "${SRCROOT}/WxMacUITests/Fixtures/wx-stub" "${DEST}/wx-stub"
          chmod +x "${DEST}/wx-stub"

name: WxIOS
options:
  bundleIdPrefix: com.mwirges
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Xcode 27 — keep LastUpgradeCheck locked so regenerate doesn't re-nag.
  xcodeVersion: "2700"
attributes:
  LastUpgradeCheck: "2700"
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    # Real team ID stays out of the repo. Signed export uses $(WX_TEAM_ID).
    DEVELOPMENT_TEAM: ""
    ARCHS: arm64
    EXCLUDED_ARCHS: "i386 x86_64"
    ENABLE_BITCODE: NO
  # Debug stays on the simulator SDK. Release is the device SDK so an
  # App Store archive is not a simulator slice.
  configs:
    Debug:
      SDKROOT: iphonesimulator
      SUPPORTED_PLATFORMS: iphonesimulator
      ONLY_ACTIVE_ARCH: YES
    Release:
      SDKROOT: iphoneos
      SUPPORTED_PLATFORMS: iphoneos
      ONLY_ACTIVE_ARCH: NO
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_BITCODE: NO
targets:
  WxIOS:
    type: application
    platform: iOS
    sources:
      - path: WxIOS
        excludes:
          - "Fixtures/**"
          - "*.entitlements"
          - PrivacyInfo.xcprivacy
      - path: WxIOS/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: WxIOS/Fixtures
        buildPhase: resources
      - path: Shared
      - path: ../macos/WxMac/Services/WeatherModels.swift
      - path: ../macos/WxMac/Services/WxTheme.swift
      - path: ../macos/WxMac/Services/WxConfig.swift
      - path: ../macos/WxMac/Services/ConditionSymbol.swift
    dependencies:
      - framework: ../build/WxCore.xcframework
        embed: false
        codeSign: false
      - target: WxWidget
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mwirges.wx.ios
        PRODUCT_NAME: wx
        INFOPLIST_FILE: WxIOS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: WxIOS/WxIOS.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        OTHER_LDFLAGS: "-lresolv -lc++ -framework Security -framework CFNetwork"
        DEAD_CODE_STRIPPING: "NO"
        ENABLE_BITCODE: NO
      configs:
        Debug:
          SDKROOT: iphonesimulator
          SUPPORTED_PLATFORMS: iphonesimulator
        Release:
          SDKROOT: iphoneos
          SUPPORTED_PLATFORMS: iphoneos
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    scheme:
      archive:
        config: Release
        revealArchiveInOrganizer: false
      run:
        config: Debug
      test:
        config: Debug
      testTargets:
        - WxWidgetTests
        - WxIOSUITests
  WxWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WxWidget
        excludes:
          - Info.plist
          - "*.entitlements"
          - PrivacyInfo.xcprivacy
      - path: WxWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mwirges.wx.ios.widget
        PRODUCT_NAME: WxWidget
        INFOPLIST_FILE: WxWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WxWidget/WxWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Debug:
          SDKROOT: iphonesimulator
          SUPPORTED_PLATFORMS: iphonesimulator
        Release:
          SDKROOT: iphoneos
          SUPPORTED_PLATFORMS: iphoneos
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  WxWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WxWidgetTests
      - path: Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mwirges.wx.ios.widgettests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        TEST_HOST: ""
        BUNDLE_LOADER: ""
      configs:
        Debug:
          SDKROOT: iphonesimulator
          SUPPORTED_PLATFORMS: iphonesimulator
        Release:
          SDKROOT: iphonesimulator
          SUPPORTED_PLATFORMS: iphonesimulator
  WxIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WxIOSUITests
    dependencies:
      - target: WxIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mwirges.wx.ios.uitests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        TEST_TARGET_NAME: WxIOS
      configs:
        Debug:
          SDKROOT: iphonesimulator
          SUPPORTED_PLATFORMS: iphonesimulator
        Release:
          SDKROOT: iphonesimulator
          SUPPORTED_PLATFORMS: iphonesimulator
